[project]
name = "officeai"
version = "0.1.0"
description = "CLI Windows pour l'automatisation bureautique intelligente propulsée par Google Gemini"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "typer[all]>=0.15.0",
    "rich>=13.9.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "xlrd>=2.0.1",
    "python-docx>=1.1.2",
    "docxtpl>=0.17.0",
    "matplotlib>=3.10.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.10.0",
    "prompt-toolkit>=3.0.40",
    "tabulate>=0.9.0",
    "odfpy>=1.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
officeai = "officeai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
